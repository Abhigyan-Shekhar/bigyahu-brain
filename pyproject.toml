[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "company-brain"
version = "0.1.0"
description = "Evidence-backed graph context for code changes"
requires-python = ">=3.11"
dependencies = ["falkordb>=1.2,<2", "fastmcp>=2,<3", "pyyaml>=6,<7", "pathspec>=0.12,<1"]

[project.optional-dependencies]
lite = ["falkordblite==0.10.0; python_version >= '3.12'"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running FalkorDB server"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]
