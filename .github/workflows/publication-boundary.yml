name: Publication boundary
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reject-local-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_publication.py --history
