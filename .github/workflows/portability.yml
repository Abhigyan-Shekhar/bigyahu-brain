name: Portability and Docker demo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python scripts/run_lite.py --help
  docker-database-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --python 3.12
      - run: docker run -d --name brain-browser-demo -p 127.0.0.1:6379:6379 falkordb/falkordb:v4.14.7
      - run: git clone https://github.com/urllib3/urllib3.git .checkouts/urllib3-browser-demo
      - run: git -C .checkouts/urllib3-browser-demo checkout --detach a37bc93b65d6bcf00d3dc43d966bab6bd130ecd8
      - name: Wait for database readiness
        run: |
          for attempt in {1..30}; do
            if docker exec brain-browser-demo redis-cli ping | grep -q PONG; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Live graph and memory regression suite
        env:
          BRAIN_INTEGRATION: '1'
        run: |
          export BRAIN_TEST_CONFIG="$RUNNER_TEMP/brain-test.yaml"
          uv run --frozen python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          Path(os.environ["BRAIN_TEST_CONFIG"]).write_text(yaml.safe_dump({
              "repo_root": str(Path.cwd()),
              "repo_id": "fixture:ci",
              "principal": "fixture",
          }))
          PY
          uv run --frozen pytest -q
      - run: uv run --frozen python scripts/prepare_browser_demo.py --checkout .checkouts/urllib3-browser-demo
      - run: uv run --frozen python scripts/verify_browser_demo.py
